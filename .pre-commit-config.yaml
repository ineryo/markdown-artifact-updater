default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black --check .
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
